[project]
name = "soulscope-backend"
version = "0.1.0"
description = "SoulScope backend worker and measurement pipeline service"
requires-python = ">=3.11,<3.12"
dependencies = [
  "fastapi==0.141.1",
  "uvicorn[standard]==0.52.3",
  "httpx==0.28.1",
  "python-multipart==0.0.32",
  "soundfile==0.14.0",
  "scipy==1.17.1",
  "numpy==2.4.6",
]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["."]
include = ["app*"]

[project.optional-dependencies]
science = [
  "praat-parselmouth==0.4.6",
  "webrtcvad-wheels==2.0.14",
]
dev = [
  "pytest==8.4.2",
  "ruff==0.16.3",
  "mypy==1.20.2",
]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.mypy]
python_version = "3.11"
strict = true
