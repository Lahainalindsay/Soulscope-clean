name: Backend Foundation

on:
  workflow_dispatch:
    inputs:
      run_hosted_supabase:
        description: "Run hosted Supabase integration tests when secrets are configured"
        required: false
        default: "false"
  pull_request:
  push:
    branches:
      - main
      - "feat/**"

jobs:
  canonical-contracts:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: packages/canonical-contracts
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - run: npm test
      - run: npm run typecheck

  python-backend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: python -m pip install --upgrade pip
      - run: python -m pip install -e "backend[dev]"
      - run: python -m compileall backend/app
      - run: PYTHONPATH=backend python -m unittest discover -s backend/tests -t backend
      - run: pytest backend/tests
      - run: ruff check backend/app backend/tests
      - run: mypy backend/app

  database-foundation:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: sudo apt-get update
      - run: sudo apt-get install -y postgresql
      - run: sudo service postgresql start
      - run: ./scripts/test-backend-foundation.sh

  hosted-supabase:
    if: github.event_name == 'workflow_dispatch' && inputs.run_hosted_supabase == 'true'
    runs-on: ubuntu-latest
    env:
      SOULSCOPE_RUN_HOSTED_TESTS: "1"
      SUPABASE_URL: ${{ secrets.SOULSCOPE_STAGING_SUPABASE_URL }}
      SUPABASE_ANON_KEY: ${{ secrets.SOULSCOPE_STAGING_SUPABASE_ANON_KEY }}
      SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SOULSCOPE_STAGING_SUPABASE_SERVICE_ROLE_KEY }}
      SOULSCOPE_SUPABASE_STORAGE_BUCKET: ${{ secrets.SOULSCOPE_STAGING_PRIVATE_AUDIO_BUCKET }}
      SOULSCOPE_STAGING_USER_A_EMAIL: ${{ secrets.SOULSCOPE_STAGING_USER_A_EMAIL }}
      SOULSCOPE_STAGING_USER_A_PASSWORD: ${{ secrets.SOULSCOPE_STAGING_USER_A_PASSWORD }}
      SOULSCOPE_STAGING_USER_B_EMAIL: ${{ secrets.SOULSCOPE_STAGING_USER_B_EMAIL }}
      SOULSCOPE_STAGING_USER_B_PASSWORD: ${{ secrets.SOULSCOPE_STAGING_USER_B_PASSWORD }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: python -m pip install --upgrade pip
      - run: python -m pip install -e "backend[dev]"
      - run: pytest backend/tests/hosted
